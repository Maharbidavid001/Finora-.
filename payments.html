<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Płatności | FINORA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .topbar {
            height: 70px;
            padding: 0 20px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 800;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: #315fa8;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back {
            border: 0;
            background: #f4f7fb;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 15px;
        }

        .page {
            max-width: 600px;
            margin: auto;
            padding: 25px 20px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #667085;
            margin-bottom: 24px;
        }

        .payment-card {
            background: white;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(20,35,60,.08);
        }

        .payment-option {
            padding: 18px;
            border: 1px solid #eaecf0;
            border-radius: 17px;
            margin-bottom: 12px;
        }

        .payment-option strong {
            display: block;
            margin-bottom: 5px;
        }

        .payment-option span {
            color: #667085;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header class="topbar">

    <div class="brand">
        <div class="brand-icon">F</div>
        <span>FINORA</span>
    </div>

    <button
        class="back"
        onclick="window.location.href='index.html'">

        ← Wróć

    </button>

</header>


<main class="page">

    <h1>Płatności</h1>

    <p class="subtitle">
        Zarządzaj płatnościami
    </p>


    <div class="payment-card">

        <div class="payment-option">
            <strong>Przelew</strong>
            <span>Przejdź do sekcji przelewów</span>
        </div>

        <div class="payment-option">
            <strong>Wypłata</strong>
            <span>Przygotuj dane do wypłaty</span>
        </div>

        <div class="payment-option">
            <strong>Historia</strong>
            <span>Podgląd operacji demonstracyjnych</span>
        </div>

    </div>

</main>

</body>
</html>
