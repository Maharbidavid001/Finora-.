<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Przelew | FINORA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .topbar {
            height: 70px;
            padding: 0 20px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 800;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: #315fa8;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back {
            border: 0;
            background: #f4f7fb;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 15px;
        }

        .page {
            max-width: 600px;
            margin: auto;
            padding: 25px 20px 100px;
        }

        .page h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .page-subtitle {
            margin: 0 0 24px;
            color: #667085;
        }

        .info-card {
            background: white;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(20,35,60,.08);
        }

        .info-icon {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: #eef4ff;
            color: #315fa8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 18px;
        }

        .info-card h2 {
            margin: 0 0 10px;
            font-size: 21px;
        }

        .info-card p {
            color: #667085;
            line-height: 1.55;
            margin-bottom: 22px;
        }

        .account {
            padding: 18px;
            background: #f4f7fb;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .account-label {
            font-size: 13px;
            color: #667085;
            margin-bottom: 7px;
        }

        .account-number {
            font-size: 17px;
            font-weight: 700;
            word-break: break-all;
        }

        .demo-note {
            font-size: 13px;
            color: #667085;
            margin-top: 18px;
        }
    </style>
</head>

<body>

<header class="topbar">

    <div class="brand">
        <div class="brand-icon">F</div>
        <span>FINORA</span>
    </div>

    <button
        class="back"
        type="button"
        onclick="window.location.href='index.html'">

        ← Wróć

    </button>

</header>


<main class="page">

    <h1>Przelew</h1>

    <p class="page-subtitle">
        Wysyłanie środków
    </p>


    <div class="info-card">

        <div class="info-icon">
            ↔
        </div>

        <h2>
            Zarejestrowany rachunek
        </h2>

        <p>
            Przelewy mogą być dokonywane tylko przeze mnie na zarejestrowane konto.
        </p>


        <div class="account">

            <div class="account-label">
                Zarejestrowany numer rachunku
            </div>

            <div class="account-number">
                6619 •••• •••• •••• 0000
            </div>
            <button
    type="button"
    class="next-button"
    onclick="window.location.href='withdrawal.html'">

    Płatność →

</button>

        </div>


        <div class="demo-note">
            FINORA — Przejdź do strony wypłaty, aby kontynuować wypłatę.
        </div>

    </div>

</main>

</body>
</html>
