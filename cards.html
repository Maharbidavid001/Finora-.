<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karty | FINORA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .topbar {
            height: 70px;
            padding: 0 20px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 800;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: #315fa8;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back {
            border: 0;
            background: #f4f7fb;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 15px;
        }

        .page {
            max-width: 600px;
            margin: auto;
            padding: 25px 20px 100px;
        }

        .page h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #667085;
            margin-bottom: 24px;
        }

        .card {
            padding: 25px;
            border-radius: 24px;
            background: linear-gradient(135deg, #315fa8, #244b8c);
            color: white;
            box-shadow: 0 15px 35px rgba(30,60,110,.25);
        }

        .card-name {
            font-size: 14px;
            opacity: .8;
            margin-bottom: 45px;
        }

        .card-number {
            font-size: 21px;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
        }

        .label {
            font-size: 11px;
            opacity: .7;
            margin-bottom: 4px;
        }

        .value {
            font-size: 14px;
            font-weight: 700;
        }

        .demo {
            margin-top: 18px;
            color: #667085;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header class="topbar">

    <div class="brand">
        <div class="brand-icon">F</div>
        <span>FINORA</span>
    </div>

    <button
        class="back"
        onclick="window.location.href='index.html'">

        ← Wróć

    </button>

</header>


<main class="page">

    <h1>Karty</h1>

    <p class="subtitle">
        Twoja karta
    </p>


    <div class="card">

        <div class="card-name">
            FINORA
        </div>

        <div class="card-number">
            •••• •••• •••• 4675
        </div>

        <div class="card-bottom">

            <div>
                <div class="label">
                    WŁAŚCICIEL
                </div>

                <div class="value">
                    DEMO USER
                </div>
            </div>

            <div>
                <div class="label">
                    WAŻNA DO
                </div>

                <div class="value">
                    12/29
                </div>
            </div>

        </div>

    </div>


    <p class="demo">
        FINORA — karta demonstracyjna. Nie jest prawdziwą kartą płatniczą.
    </p>

</main>

</body>
</html>
