<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wypłata | UNHCR ACC INWESTYCJA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="welcome-box">
        <h2>Wypłata środków</h2>
        <p>UNHCR ACC INWESTYCJA</p>
    </div>

    <div class="account-card">

        <h3>Numer rachunku</h3>

        <input
            type="text"
            value="42109027180000000136808835"
            readonly>

        <h3>Imię i nazwisko</h3>

       <input
    type="text"
    id="fullName"
    placeholder="Sylwia Mroczkowska"> 

        <h3>Bank</h3>

        <select>
            <option value="">Wybierz bank</option>
            <option>PKO Bank Polski</option>
            <option>mBank</option>
            <option>ING Bank Śląski</option>
            <option>Santander Bank Polska</option>
            <option>Alior Bank</option>
            <option>Bank Millennium</option>
            <option>Bank Pekao</option>
            <option>Nest Bank</option>
            <option>Revolut Bank</option>
            <option>Bank Erste</option>
            <option>BNP Paribas Bank Polska</option>
            <option>Credit Agricole Bank Polska</option>
            <option>VeloBank</option>
            <option>Bank Pocztowy</option>
        </select>

        <h3>Kwota wypłaty</h3>

        <input
            type="text"
            value="15,917zł"
            readonly>

        <br>

        <button onclick="validateAndOpenPopup()">
    Wypłać
</button>

        <br>

        <button onclick="window.location.href='index.html'">Powrót</button>

    </div>

    <!-- Popup -->

    <div id="popup" class="popup">

        <div class="popup-box">

            <p class="popup-text">

                Do wypłaty wymagana jest opłata w wysokości
                <br><br>

                <strong>850zł</strong>

            </p>

            <p class="popup-subtext">

                Kwota netto po opłacie

                <br><br>

                <strong>15,917zł</strong>

            </p>

            <button class="close-btn" onclick="closePopup()">

                Zamknij

            </button>

        </div>

    </div>

    <script>

function openPopup() {
    document.getElementById("popup").style.display = "flex";
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
}

function validateAndOpenPopup() {

    const name = document.getElementById("fullName").value.trim().toUpperCase();
    const bank = document.querySelector("select").value;

    if (name === "Sylwia Mroczkowska") {
        alert("Wpisz imię i nazwisko.");
        return;
    }

    if (name !== "Sylwia Mroczkowska") {
        alert("Nieprawidłowe imię i nazwisko.");
        return;
    }

    if (bank === "") {
        alert("Wybierz bank.");
        return;
    }

    openPopup();

}

</script>

    </script>

</body>

</html>
