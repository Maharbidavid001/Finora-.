<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wypłata | FINORA</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }
        .topbar {
            height: 70px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            border-bottom: 1px solid #e5e7eb;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 800;
        }
        .brand-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #315fa8;
            color: white;
            font-weight: 800;
        }
        .menu-button {
            border: 0;
            background: transparent;
            font-size: 24px;
        }
        .page {
            padding: 25px 20px 100px;
            max-width: 600px;
            margin: auto;
        }
        .page-title {
            margin-bottom: 22px;
        }
        .page-title h1 {
            margin: 0 0 7px;
            font-size: 28px;
        }
        .page-title p {
            margin: 0;
            color: #667085;
            font-size: 15px;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(20, 35, 60, 0.08);
        }
        .field {
            margin-bottom: 20px;
        }
        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }
        .field input,
        .field select {
            width: 100%;
            height: 52px;
            padding: 0 15px;
            border: 1px solid #d0d5dd;
            border-radius: 14px;
            background: white;
            color: #172033;
            font-size: 16px;
            outline: none;
        }
        .amount {
            margin: 5px 0 22px;
            padding: 18px;
            border-radius: 18px;
            background: #f4f7fb;
        }
        .amount small {
            display: block;
            margin-bottom: 7px;
            color: #667085;
        }
        .amount strong {
            font-size: 25px;
        }
        .withdraw-button {
            width: 100%;
            height: 52px;
            border: 0;
            border-radius: 14px;
            background: #315fa8;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-button {
            width: 100%;
            height: 52px;
            margin-top: 12px;
            border: 1px solid #d0d5dd;
            border-radius: 14px;
            background: white;
            color: #344054;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        /* HIDDEN POPUP CONTROL */
        #popup-toggle {
            display: none;
        }
        /* POPUP */
        .popup {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(15, 23, 42, 0.65);
        }
        #popup-toggle:checked + .popup {
            display: flex;
        }
        .popup-box {
            width: 100%;
            max-width: 400px;
            padding: 30px 24px 24px;
            background: white;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }
        .popup-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef4ff;
            color: #315fa8;
            font-size: 28px;
            font-weight: 800;
        }
        .popup-box h2 {
            margin: 0 0 10px;
            font-size: 22px;
        }
        .popup-box p {
            margin: 0 0 24px;
            color: #667085;
            font-size: 15px;
            line-height: 1.5;
        }
        .close-button {
            width: 100%;
            height: 50px;
            border: 0;
            border-radius: 14px;
            background: #315fa8;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">F</div>
            <span>FINORA</span>
        </div>
        <button class="menu-button" type="button">
            ☰
        </button>
    </header>
    <main class="page">
        <div class="page-title">
            <h1>Wypłata</h1>
            <p>Przygotuj dane do wypłaty środków.</p>
        </div>
        <div class="card">
            <div class="field">
                <label for="account">
                    Numer rachunku
                </label>
                <input
                    id="account"
                    type="text"
                    value="6619 •••• •••• •••• 0000"
                    readonly>
            </div>
            <div class="field">
                <label for="name">
                    Imię i nazwisko
                </label>
                <input
                    id="name"
                    type="text"
                    placeholder="Wpisz imię i nazwisko">
            </div>
            <div class="field">
                <label for="bank">
                    Bank
                </label>
                <select id="bank">
                    <option value="">
                        Wybierz bank
                    </option>
                    <option>
                        PKO Bank Polski
                    </option>
                    <option>
                        mBank
                    </option>
                    <option>
                        ING Bank Śląski
                    </option>
                    <option>
                        Santander Bank Polska
                    </option>
                    <option>
                        Alior Bank
                    </option>
                    <option>
                        Bank Millennium
                    </option>
                    <option>
                        Bank Pekao
                    </option>
                    <option>
                        Nest Bank
                    </option>
                </option>
                        BNP Paribas Bank Polska
                </option>
                </option>
                        Credit Agricole Bank Polska
                </option>
                </option>
                    Revolut
                </option>
                </option>
                        Citi Handlowy
                </option>
                </option>
                    Velo bank
                </option> 
                </select>
            </div>
            <div class="amount">
                <small>Kwota wypłaty</small>
                <strong>15 000,00 zł</strong>
            </div>
            <!-- OPEN POPUP -->
            <label for="popup-toggle" class="withdraw-button">
                Wypłać
            </label>
            <button
                type="button"
                class="back-button"
                onclick="window.location.href='index.html'">
                Powrót
            </button>
        </div>
    </main>
    <!-- POPUP -->
    <input type="checkbox" id="popup-toggle">
    <div class="popup">
        <div class="popup-box">
            <div class="popup-icon">
                ✓
            </div>
            <h2>
                Przetwarzanie wypłaty
            </h2>
            <p>
                Szczegóły wypłaty zostały zweryfikowane.
                Proszę zapłacić 1 065,00 zł, aby w pełni przetworzyć wypłatę.
            </p>
            <label for="popup-toggle" class="close-button">
                Zamknij
            </label>
        </div>
    </div>
</body>
</html>
