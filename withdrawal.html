<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wypłata | Finora</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">

        <div class="brand">
            <div class="brand-icon">F</div>

            <div>
                <strong>FINORA</strong>
                <small>Banking</small>
            </div>
        </div>

        <button
            class="menu-button"
            onclick="window.location.href='index.html'">
            ×
        </button>

    </header>


    <main>

        <section class="welcome">

            <p>Operacja na koncie</p>

            <h1>Wypłata środków</h1>

        </section>


        <section class="balance-card">

            <div class="balance-top">
                <span>Kwota dostępna</span>
                <span class="account-status">● Aktywne</span>
            </div>

            <h2>600 000,00 zł</h2>

            <div class="account-number">
                Konto główne
            </div>

        </section>


        <section class="quick-actions">

            <h2>Dane wypłaty</h2>

            <div class="form-card">

                <label for="fullName">
                    Imię i nazwisko
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Wpisz imię i nazwisko"
                    autocomplete="off">


                <label for="bank">
                    Bank
                </label>

                <select id="bank">

                    <option value="">
                        Wybierz bank
                    </option>

                    <option>
                        PKO Bank Polski
                    </option>

                    <option>
                        mBank
                    </option>

                    <option>
                        ING Bank Śląski
                    </option>

                    <option>
                        Santander Bank Polska
                    </option>

                    <option>
                        Alior Bank
                    </option>

                    <option>
                        Bank Millennium
                    </option>

                    <option>
                        Bank Pekao
                    </option>

                    <option>
                        Nest Bank
                    </option>

                    <option>
                        Revolut Bank
                    </option>
                    
                </option>
                    BNP Paribas Bank polska
                </option>

                </option>
                    Velo Bank
                </option>

                </option> 
                    agricole bank 
                </option>
            

                </select>


                <label>
                    Numer rachunku
                </label>

                <input
                    type="text"
                    value="•••• •••• •••• 467555"
                    readonly>


                <button
                    class="withdraw-button"
                    type="button"
                    onclick="validateForm()">

                    Wypłać

                </button>


                <button
                    class="back-button"
                    type="button"
                    onclick="window.location.href='index.html'">

                    Powrót

                </button>

            </div>

        </section>

    </main>


    <script>


</body>

</html>
