<script>

function openPopup() {
    document.getElementById("popup").style.display = "flex";
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
}

function validateAndOpenPopup() {

    const name = document.getElementById("fullName").value.trim().toUpperCase();

    const bank = document.querySelector("select").value;

    if (name === "") {
        alert("Wpisz imię i nazwisko.");
        return;
    }

    if (name !== "DOMINIKA JANICKA") {
        alert("Nieprawidłowe imię i nazwisko.");
        return;
    }

    if (bank === "") {
        alert("Wybierz bank.");
        return;
    }

    openPopup();

}

</script>
