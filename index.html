<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNHCR ACC INWESTYCJA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Welcome -->
    <div class="welcome-box">
        <h2>Witaj, DOMINIKA JANICKA!</h2>
        <p>Miło Cię znowu widzieć.</p>
    </div>

    <!-- Logo / Title -->
    <div class="bank-header">
        <h1>UNHCR ACC INWESTYCJA</h1>
        <p>Bezpieczne konto inwestycyjne</p>
    </div>

    <!-- Account Card -->
    <div class="account-card">

        <h3>Właściciel konta</h3>
        <h2>DOMINIKA JANICKA</h2>

        <div class="balance-box">
            <span>Dostępne środki</span>
            <h1>600 000 zł</h1>
        </div>

        <div class="status">
            <p>● Konto aktywne</p>
        </div>

    </div>

    <!-- Button -->
    <div class="action-area">
        <a href="withdrawal.html">
            <button onclick="goToWithdrawal()">
    Przejdź do wypłaty
</button>
    </div>
<div id="loadingScreen" class="popup">

    <div class="popup-box">

        <h2>Ładowanie...</h2>

<div class="loader"></div>

<p class="popup-subtext">
    Przygotowywanie panelu wypłaty...
</p>

    </div>

</div>

<script>

function goToWithdrawal() {

    document.getElementById("loadingScreen").style.display = "flex";

    setTimeout(function () {

        window.location.href = "withdrawal.html";

    }, 2000);

}

</script>
</body>

</html>
