<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finora Banking</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">

        <div class="brand">
            <div class="brand-icon">F</div>

            <div>
                <strong>FINORA</strong>
                <small>Banking</small>
            </div>
        </div>

        <button class="menu-button">☰</button>

    </header>


    <main>

        <section class="welcome">

            <p>Dzień dobry</p>

            <h1>Witaj, Paweł Kopiec</h1>

        </section>


        <section class="balance-card">

            <div class="balance-top">

                <span>Konto główne</span>

                <span class="account-status">
                    ● Aktywne
                </span>

            </div>

            <p>Dostępne środki</p>

            <h2>600 000,00 zł</h2>

            <div class="account-number">
                •••• •••• •••• 67555
            </div>

        </section>


        <section class="quick-actions">

            <h2>Szybkie działania</h2>

            <div class="actions">

                <button>
                    <span>↗</span>
                    Przelew
                </button>

                <button>
                    <span>＋</span>
                    Wpłata
                </button>

                <a href="withdrawal.html">
                    <button>
                        <span>−</span>
                        Wypłata
                    </button>
                </a>

                <button>
                    <span>▣</span>
                    Karty
                </button>

            </div>

        </section>


        <section class="transactions">

            <div class="section-title">

                <h2>Ostatnie operacje</h2>

                <span>Wszystkie</span>

            </div>


            <div class="transaction">

                <div class="transaction-icon">
                    ↓
                </div>

                <div class="transaction-info">

                    <strong>Wpłata</strong>

                    <small>Dzisiaj, 11:51</small>

                </div>

                <strong class="positive">
                    +2 000,00 zł
                </strong>

            </div>


            <div class="transaction">

                <div class="transaction-icon">
                    ↗
                </div>

                <div class="transaction-info">

                    <strong>Przelew</strong>

                    <small>Wczoraj, 15:20</small>

                </div>

                <strong>
                    -850,00 zł
                </strong>

            </div>


            <div class="transaction">

                <div class="transaction-icon">
                    ▣
                </div>

                <div class="transaction-info">

                    <strong>Płatność kartą</strong>

                    <small>28 sierpnia, 19:42</small>

                </div>

                <strong>
                    -120,00 zł
                </strong>

            </div>

        </section>

    </main>


    <nav class="bottom-navigation">

        <button>
            <span>⌂</span>
            Start
        </button>

        <button>
            <span>↔</span>
            Operacje
        </button>

        <button>
            <span>▣</span>
            Karty
        </button>

        <button>
            <span>⋯</span>
            Więcej
        </button>

    </nav>

</body>

</html>
